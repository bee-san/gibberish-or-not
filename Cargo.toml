[package]
name = "gibberish-or-not"
version = "6.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Is this text natural language or gibberish? A calibrated, multi-language, no_std and WASM-ready detector."
repository = "https://github.com/bee-san/gibberish-or-not"
documentation = "https://docs.rs/gibberish-or-not"
readme = "README.md"
keywords = ["gibberish", "language-detection", "plaintext", "wasm", "no-std"]
categories = ["text-processing", "no-std", "wasm"]
# Only the library, its language packs and the docs: the benchmark corpus (which has
# evaluation-only data) and the build scripts stay in the repository.
include = [
    "/src/**/*.rs",
    "/tests/*.rs",
    "/tests/fixtures/*",
    "/languages/*/model.bin",
    "/languages/*/calibration.txt",
    "/languages/*/README.md",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/MIGRATION.md",
    "/docs/*.md",
]

[workspace]
members = [".", "bench", "bench/wasm-probe"]

[features]
# Every language is a feature, all on by default. A language whose pack hasn't landed yet
# is a no-op (see src/registry.rs and docs/languages.md).
default = ["en", "es", "fr", "de", "it", "pt", "nl", "pl", "tr", "ru", "zh", "ja", "ko"]
en = []
es = []
fr = []
de = []
it = []
pt = []
nl = []
pl = []
tr = []
ru = []
zh = []
ja = []
ko = []
# `impl std::error::Error` and nothing else; the library is no_std + alloc without it.
std = []
# The `gibberish` command-line tool.
cli = ["std"]
# JavaScript bindings (wasm-bindgen) for wasm32-unknown-unknown.
wasm = ["std", "dep:wasm-bindgen"]

[dependencies]
once_cell = { version = "1.19", default-features = false, features = ["race", "alloc"] }
phf = { version = "0.11", default-features = false, features = ["macros"] }
wasm-bindgen = { version = "=0.2.130", optional = true }

[dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "wasm"
required-features = ["wasm"]

[[bin]]
name = "gibberish"
path = "src/bin/gibberish.rs"
required-features = ["cli"]

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"
