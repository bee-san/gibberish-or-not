name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are pinned to commits; the tools are downloaded over HTTPS only and checked
# against the sha256 their publishers give (release digests / .sha256 files).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  WASM_BINDGEN_VERSION: 0.2.130
  WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
  BINARYEN_VERSION: "133"
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
  WASMTIME_VERSION: v50.0.1
  WASMTIME_SHA256: 685466455dd42a14774a86c36c8f2e45cbb9bd6d92a850139315df60a75498a5

jobs:
  test:
    name: fmt, clippy, tests, accuracy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: clippy (cli feature)
        run: cargo clippy --locked --all-targets --features cli -- -D warnings
      - name: tests
        run: cargo test --locked --workspace
      - name: no_std library without default features
        run: cargo build --locked --lib --no-default-features
      - name: pack writer self-test (hashes shared with src/pack.rs) and fixture determinism
        run: |
          python3 languages/common/packlib.py
          python3 tests/fixtures/make_hashed_fixture.py
          git diff --exit-code tests/fixtures
      - name: accuracy gate (corpus v1, dev split, every language)
        run: cargo run --locked --release -p gib-bench -- gate

  wasm:
    name: wasm32 build, tests under node and wasmtime, size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: tools (wasm-bindgen, wasm-opt, wasmtime), checksums verified
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          fetch() { curl -sSfL --proto '=https' --tlsv1.2 -o "$2" "$1" && echo "$3  $2" | sha256sum -c -; }
          cd /tmp
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" wasm-bindgen.tar.gz "$WASM_BINDGEN_SHA256"
          tar xzf wasm-bindgen.tar.gz
          cp wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen* "$HOME/.local/bin/"
          fetch "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" binaryen.tar.gz "$BINARYEN_SHA256"
          tar xzf binaryen.tar.gz
          cp -r binaryen-version_${BINARYEN_VERSION}/bin/* "$HOME/.local/bin/"
          cp -r binaryen-version_${BINARYEN_VERSION}/lib "$HOME/.local/" || true
          fetch "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" wasmtime.tar.xz "$WASMTIME_SHA256"
          tar xJf wasmtime.tar.xz
          cp wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: library builds for wasm32-unknown-unknown with default features
        run: cargo build --locked --lib --target wasm32-unknown-unknown
      - name: clippy (wasm32, wasm feature)
        run: cargo clippy --locked --lib --target wasm32-unknown-unknown --features wasm -- -D warnings
      - name: wasm-bindgen tests under node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown --features wasm --test wasm
      - name: tests under wasmtime (wasm32-wasip1, 32-bit usize)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --locked --target wasm32-wasip1 --lib --test detect --test crafted_packs --test hashed_pack --test many_packs
      - name: size budgets (every language, and the WASM module after wasm-opt -Oz)
        run: cargo run --locked --release -p gib-bench -- sizes --wasm --no-latency --check
