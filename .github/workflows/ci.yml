name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  WASM_BINDGEN_VERSION: 0.2.130
  BINARYEN_VERSION: "133"
  WASMTIME_VERSION: v50.0.1

jobs:
  test:
    name: fmt, clippy, tests, accuracy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (cli feature)
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: no_std library without default features
        run: cargo build --lib --no-default-features
      - name: accuracy gate (corpus v1, dev split, every language)
        run: cargo run --release -p gib-bench -- gate

  wasm:
    name: wasm32 build, tests under node and wasmtime, size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: tools (wasm-bindgen, wasm-opt, wasmtime)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          cp /tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen* "$HOME/.local/bin/"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C /tmp
          cp -r /tmp/binaryen-version_${BINARYEN_VERSION}/bin/* "$HOME/.local/bin/"
          cp -r /tmp/binaryen-version_${BINARYEN_VERSION}/lib "$HOME/.local/" || true
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar xJ -C /tmp
          cp /tmp/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: library builds for wasm32-unknown-unknown with default features
        run: cargo build --lib --target wasm32-unknown-unknown
      - name: clippy (wasm32, wasm feature)
        run: cargo clippy --lib --target wasm32-unknown-unknown --features wasm -- -D warnings
      - name: wasm-bindgen tests under node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown --features wasm --test wasm
      - name: tests under wasmtime (wasm32-wasip1)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --target wasm32-wasip1 --test detect
      - name: size budgets (every language, and the WASM module after wasm-opt -Oz)
        run: cargo run --release -p gib-bench -- sizes --wasm --no-latency --check
